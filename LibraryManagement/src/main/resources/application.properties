# ====================================================
# CẤU HÌNH ỨNG DỤNG - LIBRARY MANAGEMENT SYSTEM
# ====================================================

# --- Server ---
server.port=${PORT:8080}
server.address=0.0.0.0

# --- Database Configuration ---
# Mặc định sử dụng H2 file-based persistent database (lưu trong thư mục ./data/library_db)
# Giúp ứng dụng chạy ngay lập tức, đầy đủ chức năng, không bị lỗi kết nối cơ sở dữ liệu.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/library_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- PostgreSQL (Bỏ comment bên dưới nếu bạn muốn chuyển sang PostgreSQL) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
# spring.datasource.username=postgres
# spring.datasource.password=123456
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- File Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Logging ---
logging.level.com.library=DEBUG
logging.level.org.springframework.security=INFO

# --- Session ---
server.servlet.session.timeout=30m
