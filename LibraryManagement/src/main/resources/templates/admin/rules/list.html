<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}"
      lang="vi">
<head>
    <title>Cấu hình Quy định</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div class="page-header-left">
            <h1 class="page-title"><i class="fas fa-cog"></i> Cấu hình Quy định Thư viện</h1>
            <p class="page-subtitle">Thiết lập các giới hạn mượn trả, hạn mượn và mức phạt</p>
        </div>
    </div>

    <!-- Thông báo Flash message -->
    <div th:if="${successMessage}" class="alert alert-success" style="padding: 12px 16px; background: #e8f5e9; color: #2e7d32; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" style="padding: 12px 16px; background: #ffebee; color: #c62828; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="dashboard-card">
        <div class="card-body" style="padding: 0;">
            <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left;">
                    <th style="padding: 14px 16px;">Mã quy định (Key)</th>
                    <th style="padding: 14px 16px;">Giá trị hiện tại</th>
                    <th style="padding: 14px 16px;">Mô tả ý nghĩa</th>
                    <th style="padding: 14px 16px; text-align: center;">Cập nhật</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rule : ${rules}" style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 14px 16px; font-weight: 600; font-family: monospace; color: #0f172a;" th:text="${rule.ruleKey}">MAX_BORROW_COPIES</td>
                    <td style="padding: 14px 16px;">
                        <form th:action="@{/admin/rules/update}" method="post" style="display: flex; gap: 8px; align-items: center;">
                            <input type="hidden" name="id" th:value="${rule.id}">
                            <input type="text" name="ruleValue" th:value="${rule.ruleValue}" required class="form-control" style="width: 120px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600;">
                            <button type="submit" class="btn btn-sm btn-primary">Lưu</button>
                        </form>
                    </td>
                    <td style="padding: 14px 16px; color: #475569;" th:text="${rule.description}">Mô tả quy định</td>
                    <td style="padding: 14px 16px; text-align: center; color: #94a3b8; font-size: 0.85rem;" th:text="${rule.updatedAt}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
