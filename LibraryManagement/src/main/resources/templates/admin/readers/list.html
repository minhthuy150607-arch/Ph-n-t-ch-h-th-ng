<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}"
      lang="vi">
<head>
    <title>Quản lý Bạn đọc</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div class="page-header-left">
            <h1 class="page-title"><i class="fas fa-users"></i> Quản lý Bạn đọc</h1>
            <p class="page-subtitle">Danh sách tài khoản độc giả thư viện</p>
        </div>
        <div class="page-header-right">
            <a th:href="@{/admin/readers/new}" class="btn btn-primary">
                <i class="fas fa-user-plus"></i> Thêm bạn đọc mới
            </a>
        </div>
    </div>

    <!-- Thông báo Flash message -->
    <div th:if="${successMessage}" class="alert alert-success" style="padding: 12px 16px; background: #e8f5e9; color: #2e7d32; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" style="padding: 12px 16px; background: #ffebee; color: #c62828; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="dashboard-card">
        <div class="card-body" style="padding: 0;">
            <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left;">
                    <th style="padding: 14px 16px;">Mã thẻ</th>
                    <th style="padding: 14px 16px;">Tên đăng nhập</th>
                    <th style="padding: 14px 16px;">Họ và tên</th>
                    <th style="padding: 14px 16px;">Email</th>
                    <th style="padding: 14px 16px;">Số điện thoại</th>
                    <th style="padding: 14px 16px; text-align: center;">Trạng thái</th>
                    <th style="padding: 14px 16px; text-align: center;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reader : ${readers}" style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 14px 16px; font-weight: 600; color: #2563eb;" th:text="${reader.readerCode}">BD001</td>
                    <td style="padding: 14px 16px; font-weight: 500;" th:text="${reader.username}">reader</td>
                    <td style="padding: 14px 16px;" th:text="${reader.fullName}">Nguyễn Văn An</td>
                    <td style="padding: 14px 16px; color: #64748b;" th:text="${reader.email} ?: '-'">an@example.com</td>
                    <td style="padding: 14px 16px; color: #64748b;" th:text="${reader.phone} ?: '-'">0912345678</td>
                    <td style="padding: 14px 16px; text-align: center;">
                        <span th:if="${reader.status == 'ACTIVE'}" class="badge" style="background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 12px;">Hoạt động</span>
                        <span th:if="${reader.status == 'LOCKED'}" class="badge" style="background: #fee2e2; color: #b91c1c; padding: 4px 10px; border-radius: 12px;">Bị khóa</span>
                    </td>
                    <td style="padding: 14px 16px; text-align: center;">
                        <div style="display: inline-flex; gap: 8px;">
                            <a th:href="@{/admin/readers/edit/{id}(id=${reader.id})}" class="btn btn-sm btn-outline" title="Chỉnh sửa">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/admin/readers/toggle-status/{id}(id=${reader.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm" th:classappend="${reader.status == 'ACTIVE'} ? 'btn-danger' : 'btn-primary'"
                                        th:title="${reader.status == 'ACTIVE'} ? 'Khóa tài khoản' : 'Mở khóa tài khoản'">
                                    <i th:class="${reader.status == 'ACTIVE'} ? 'fas fa-lock' : 'fas fa-lock-open'"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(readers)}">
                    <td colspan="7" style="text-align: center; padding: 40px; color: #64748b;">
                        Chưa có bạn đọc nào trong hệ thống.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
