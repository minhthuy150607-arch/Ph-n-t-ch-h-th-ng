<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}"
      lang="vi">
<head>
    <title th:text="${pageTitle}">Thêm / Sửa Bạn đọc</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div class="page-header-left">
            <h1 class="page-title" th:text="${reader.id != null} ? 'Chỉnh sửa Bạn đọc' : 'Thêm Bạn đọc mới'">Thêm Bạn đọc mới</h1>
            <p class="page-subtitle">Quản lý hồ sơ độc giả và cấp thẻ</p>
        </div>
        <div class="page-header-right">
            <a th:href="@{/admin/readers}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>
    </div>

    <div class="dashboard-card" style="max-width: 700px; margin: 0 auto; padding: 24px;">
        <form th:action="${reader.id != null} ? @{/admin/readers/edit/{id}(id=${reader.id})} : @{/admin/readers/new}"
              th:object="${reader}" method="post">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">Tên đăng nhập <span style="color: red;">*</span></label>
                    <input type="text" th:field="*{username}" required class="form-control" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px;" th:readonly="${reader.id != null}">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">Mật khẩu <span th:if="${reader.id == null}" style="color: red;">*</span> (Mặc định: 123456)</label>
                    <input type="password" name="rawPassword" class="form-control" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px;" placeholder="Nhập để đổi mật khẩu mới">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">Họ và tên <span style="color: red;">*</span></label>
                    <input type="text" th:field="*{fullName}" required class="form-control" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">Mã thẻ bạn đọc (Tự sinh nếu trống)</label>
                    <input type="text" th:field="*{readerCode}" class="form-control" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px;" placeholder="Ví dụ: BD001">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">Số điện thoại</label>
                    <input type="tel" th:field="*{phone}" class="form-control" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
            </div>

            <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
                <a th:href="@{/admin/readers}" class="btn btn-outline">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Lưu thông tin
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
