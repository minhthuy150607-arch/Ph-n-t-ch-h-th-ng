<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}"
      lang="vi">
<head>
    <title>Quản lý Đặt trước</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div class="page-header-left">
            <h1 class="page-title"><i class="fas fa-bookmark"></i> Quản lý Đặt Trước Sách</h1>
            <p class="page-subtitle">Danh sách bạn đọc gửi yêu cầu giữ sách trước</p>
        </div>
    </div>

    <!-- Thông báo Flash message -->
    <div th:if="${successMessage}" class="alert alert-success" style="padding: 12px 16px; background: #e8f5e9; color: #2e7d32; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" style="padding: 12px 16px; background: #ffebee; color: #c62828; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="dashboard-card">
        <div class="card-body" style="padding: 0;">
            <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left;">
                    <th style="padding: 14px 16px;">Bạn đọc</th>
                    <th style="padding: 14px 16px;">Sách đặt trước</th>
                    <th style="padding: 14px 16px;">Ngày đặt</th>
                    <th style="padding: 14px 16px;">Hạn giữ sách</th>
                    <th style="padding: 14px 16px; text-align: center;">Trạng thái</th>
                    <th style="padding: 14px 16px; text-align: center;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservations}" style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 14px 16px;">
                        <span style="font-weight: 500;" th:text="${r.user.fullName}">Nguyễn Văn An</span>
                        <div style="font-size: 0.85rem; color: #64748b;" th:text="'Mã: ' + ${r.user.readerCode}">Mã: BD001</div>
                    </td>
                    <td style="padding: 14px 16px;">
                        <a th:href="@{/admin/books/{id}(id=${r.book.id})}" style="font-weight: 600; color: #1e293b; text-decoration: none;" th:text="${r.book.title}">Tên sách</a>
                        <div style="font-size: 0.85rem; color: #64748b;" th:text="'Mã: ' + ${r.book.bookCode}">Mã: BK-001</div>
                    </td>
                    <td style="padding: 14px 16px; color: #475569;" th:text="${#temporals.format(r.reservationDate, 'yyyy-MM-dd HH:mm')}">2025-01-01 10:00</td>
                    <td style="padding: 14px 16px; color: #475569;" th:text="${#temporals.format(r.expiryDate, 'yyyy-MM-dd HH:mm')}">2025-01-04 10:00</td>
                    <td style="padding: 14px 16px; text-align: center;">
                        <span th:if="${r.status == 'PENDING'}" class="badge" style="background: #fef3c7; color: #b45309; padding: 4px 10px; border-radius: 12px;">Đang chờ</span>
                        <span th:if="${r.status == 'FULFILLED'}" class="badge" style="background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 12px;">Đã nhận sách</span>
                        <span th:if="${r.status == 'CANCELLED'}" class="badge" style="background: #fee2e2; color: #b91c1c; padding: 4px 10px; border-radius: 12px;">Đã hủy</span>
                    </td>
                    <td style="padding: 14px 16px; text-align: center;">
                        <form th:if="${r.status == 'PENDING'}" th:action="@{/admin/reservations/cancel/{id}(id=${r.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn hủy yêu cầu đặt trước này?');" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="fas fa-times"></i> Hủy
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservations)}">
                    <td colspan="6" style="text-align: center; padding: 40px; color: #64748b;">
                        Hiện tại không có yêu cầu đặt trước nào.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
