<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'In Tem QR Code - ' + ${book.title}">In Tem QR Code</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 24px;
        }

        .no-print {
            max-width: 900px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-outline {
            background: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-outline:hover {
            background: #e2e8f0;
        }

        /* Khổ in và bố cục danh sách tem */
        .labels-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 16px;
        }

        .label-card {
            background: white;
            border: 2px dashed #94a3b8;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            page-break-inside: avoid;
            position: relative;
        }

        .library-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 6px;
        }

        .qr-image-wrapper {
            width: 140px;
            height: 140px;
            margin: 6px 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-image-wrapper img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .copy-barcode {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: 1px;
            background: #f8fafc;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            margin-bottom: 6px;
        }

        .book-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.3;
            max-height: 2.6em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 4px;
        }

        .book-author {
            font-size: 0.75rem;
            color: #64748b;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .labels-container {
                max-width: 100%;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .label-card {
                border: 1px solid #64748b;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <!-- Thanh thao tác in ấn -->
    <div class="no-print">
        <div>
            <h2 style="font-size: 1.25rem; font-weight: 700;">In Tem QR Code Dán Sách</h2>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 2px;">
                Đầu sách: <strong th:text="${book.title}"></strong> (<span th:text="${#lists.size(copies)} + ' tem'"></span>)
            </p>
        </div>
        <div style="display: flex; gap: 10px;">
            <a th:href="@{/admin/books/{id}(id=${book.id})}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
            <button onclick="window.print()" class="btn btn-primary">
                <i class="fas fa-print"></i> In Tem Ngay
            </button>
        </div>
    </div>

    <!-- Danh sách tem nhãn -->
    <div class="labels-container">
        <div class="label-card" th:each="copy : ${copies}">
            <div class="library-tag">THƯ VIỆN ĐIỆN TỬ</div>
            <div class="qr-image-wrapper">
                <img th:src="@{/api/qr/image(code=${copy.barcode},size=200)}" alt="QR Code">
            </div>
            <div class="copy-barcode" th:text="${copy.barcode}">BC-001</div>
            <div class="book-title" th:text="${book.title}">Tên cuốn sách</div>
            <div class="book-author" th:text="'TG: ' + ${book.author}">Tác giả</div>
        </div>
    </div>

</body>
</html>
