<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}"
      lang="vi">
<head>
    <title>Quản lý Tài khoản Hệ thống</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <div class="page-header-left">
            <h1 class="page-title"><i class="fas fa-user-cog"></i> Quản lý Tài khoản Hệ thống</h1>
            <p class="page-subtitle">Quản lý phân quyền Quản trị viên, Thủ thư và Bạn đọc</p>
        </div>
        <div class="page-header-right">
            <a th:href="@{/admin/accounts/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Thêm tài khoản mới
            </a>
        </div>
    </div>

    <!-- Thông báo Flash message -->
    <div th:if="${successMessage}" class="alert alert-success" style="padding: 12px 16px; background: #e8f5e9; color: #2e7d32; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" style="padding: 12px 16px; background: #ffebee; color: #c62828; border-radius: 8px; margin-bottom: 20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="dashboard-card">
        <div class="card-body" style="padding: 0;">
            <table class="admin-table" style="width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left;">
                    <th style="padding: 14px 16px;">Tên đăng nhập</th>
                    <th style="padding: 14px 16px;">Họ và tên</th>
                    <th style="padding: 14px 16px;">Email</th>
                    <th style="padding: 14px 16px; text-align: center;">Vai trò</th>
                    <th style="padding: 14px 16px; text-align: center;">Trạng thái</th>
                    <th style="padding: 14px 16px; text-align: center;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="acc : ${accounts}" style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 14px 16px; font-weight: 600;" th:text="${acc.username}">admin</td>
                    <td style="padding: 14px 16px;" th:text="${acc.fullName}">Quản trị viên</td>
                    <td style="padding: 14px 16px; color: #64748b;" th:text="${acc.email} ?: '-'">admin@library.com</td>
                    <td style="padding: 14px 16px; text-align: center;">
                        <span th:if="${acc.role == 'ADMIN'}" class="badge" style="background: #fef3c7; color: #b45309; padding: 4px 10px; border-radius: 12px; font-weight: 600;">ADMIN</span>
                        <span th:if="${acc.role == 'READER'}" class="badge" style="background: #e0f2fe; color: #0284c7; padding: 4px 10px; border-radius: 12px; font-weight: 600;">BẠN ĐỌC</span>
                    </td>
                    <td style="padding: 14px 16px; text-align: center;">
                        <span th:if="${acc.status == 'ACTIVE'}" class="badge" style="background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 12px;">Hoạt động</span>
                        <span th:if="${acc.status == 'LOCKED'}" class="badge" style="background: #fee2e2; color: #b91c1c; padding: 4px 10px; border-radius: 12px;">Đang khóa</span>
                    </td>
                    <td style="padding: 14px 16px; text-align: center;">
                        <div style="display: inline-flex; gap: 8px;">
                            <a th:href="@{/admin/accounts/edit/{id}(id=${acc.id})}" class="btn btn-sm btn-outline" title="Chỉnh sửa">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/admin/accounts/reset-password/{id}(id=${acc.id})}" method="post" onsubmit="return confirm('Đặt lại mật khẩu về mặc định (123456)?');" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-outline" title="Reset mật khẩu">
                                    <i class="fas fa-key"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/accounts/toggle-status/{id}(id=${acc.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm" th:classappend="${acc.status == 'ACTIVE'} ? 'btn-danger' : 'btn-primary'"
                                        th:title="${acc.status == 'ACTIVE'} ? 'Khóa tài khoản' : 'Mở khóa tài khoản'">
                                    <i th:class="${acc.status == 'ACTIVE'} ? 'fas fa-lock' : 'fas fa-lock-open'"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
