<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/client-layout}"
      lang="vi">
<head>
    <title>Đăng nhập - Thư Viện Số</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="login-container">
            <div class="login-card">
                <!-- Header -->
                <div class="login-header">
                    <div class="login-icon">
                        <i class="fas fa-book-reader"></i>
                    </div>
                    <h1>Đăng Nhập Hệ Thống</h1>
                    <p>Truy cập tài khoản để mượn sách &amp; quản lý hoạt động</p>
                </div>

                <!-- Thông báo lỗi -->
                <div th:if="${param.error}" class="alert alert-danger">
                    <i class="fas fa-exclamation-circle" style="font-size: 1.1rem;"></i>
                    <span>Tên đăng nhập hoặc mật khẩu không chính xác.</span>
                </div>

                <!-- Thông báo đăng xuất thành công -->
                <div th:if="${param.logout}" class="alert alert-info">
                    <i class="fas fa-check-circle" style="font-size: 1.1rem;"></i>
                    <span>Bạn đã đăng xuất khỏi hệ thống thành công.</span>
                </div>

                <!-- Thông báo thành công từ flash -->
                <div th:if="${successMessage}" class="alert alert-success">
                    <i class="fas fa-check-circle" style="font-size: 1.1rem;"></i>
                    <span th:text="${successMessage}"></span>
                </div>

                <!-- Form đăng nhập -->
                <form th:action="@{/login}" method="post" class="login-form">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Tên đăng nhập
                        </label>
                        <input type="text" id="username" name="username"
                               placeholder="Nhập tên tài khoản của bạn"
                               required autofocus autocomplete="username" class="form-control">
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label for="password" style="margin-bottom: 0;">
                                <i class="fas fa-lock"></i> Mật khẩu
                            </label>
                        </div>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password"
                                   placeholder="Nhập mật khẩu"
                                   required autocomplete="current-password" class="form-control">
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Hiện mật khẩu">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Đăng Nhập
                    </button>
                </form>

                <!-- Box gợi ý tài khoản Demo -->
                <div style="margin-top: 24px; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: var(--border-radius); padding: 14px 16px; font-size: 0.82rem; color: var(--text-secondary);">
                    <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                        <i class="fas fa-lightbulb" style="color: #f59e0b;"></i> Tài khoản mẫu dùng thử:
                    </div>
                    <div style="display: flex; justify-content: space-between; gap: 8px;">
                        <div><strong>Quản trị:</strong> admin / 123456</div>
                        <div><strong>Bạn đọc:</strong> reader1 / 123456</div>
                    </div>
                </div>

                <!-- Chuyển sang đăng ký -->
                <div class="login-footer" style="border-top: 1px solid var(--border-color-subtle); padding-top: 20px;">
                    <p style="margin: 0; color: var(--text-secondary); font-size: 0.9rem;">
                        Chưa có tài khoản độc giả?
                        <a th:href="@{/register}" style="color: var(--color-accent); font-weight: 700;">Đăng ký ngay &rarr;</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
