<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/client-layout}"
      lang="vi">
<head>
    <title>Đổi Mật Khẩu - Thư Viện Số</title>
</head>
<body>
<div layout:fragment="content" style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 60px;">
    <div style="max-width: 520px; margin: 20px auto; background: white; border-radius: var(--border-radius-xl); padding: 36px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color);">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 56px; height: 56px; background: #fffbeb; color: #d97706; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 12px; border: 1px solid #fde68a;">
                <i class="fas fa-key"></i>
            </div>
            <h1 style="font-size: 1.5rem; margin: 0 0 4px 0; color: var(--text-primary);">Đổi Mật Khẩu</h1>
            <p style="margin: 0; color: var(--text-secondary); font-size: 0.9rem;">Bảo vệ an toàn cho tài khoản bạn đọc của bạn</p>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/reader/change-password}" method="post">
            <div class="form-group">
                <label>
                    <i class="fas fa-lock-open"></i> Mật khẩu hiện tại <span style="color: var(--color-danger);">*</span>
                </label>
                <input type="password" name="oldPassword" required class="form-control" placeholder="Nhập mật khẩu hiện tại">
            </div>

            <div class="form-group">
                <label>
                    <i class="fas fa-key"></i> Mật khẩu mới <span style="color: var(--color-danger);">*</span>
                </label>
                <input type="password" name="newPassword" required class="form-control" placeholder="Tối thiểu 6 ký tự">
            </div>

            <div class="form-group">
                <label>
                    <i class="fas fa-check-double"></i> Xác nhận lại mật khẩu mới <span style="color: var(--color-danger);">*</span>
                </label>
                <input type="password" name="confirmPassword" required class="form-control" placeholder="Nhập lại mật khẩu mới">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; border-top: 1px solid var(--border-color-subtle); padding-top: 20px;">
                <a th:href="@{/reader/profile}" class="btn btn-outline">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">
                    <i class="fas fa-check-circle"></i> Đổi Mật Khẩu
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
