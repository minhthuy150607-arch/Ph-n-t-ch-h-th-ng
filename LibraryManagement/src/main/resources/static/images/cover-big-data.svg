      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="dataGlow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#gradBigData)"/>
  <circle cx="200" cy="190" r="100" fill="url(#dataGlow)"/>
  
