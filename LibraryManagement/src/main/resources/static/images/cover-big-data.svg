  <text x="200" y="80" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4">KỶ NGUYÊN CÔNG NGHỆ</text>
  <text x="200" y="335" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900">DỮ LIỆU LỚN</text>
