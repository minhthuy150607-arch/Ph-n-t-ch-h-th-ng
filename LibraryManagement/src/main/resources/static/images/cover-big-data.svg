  <line x1="250" y1="180" x2="230" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <line x1="170" y1="240" x2="230" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <line x1="150" y1="180" x2="250" y2="180" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4"/>

  <circle cx="200" cy="130" r="9" fill="#e0f2fe"/>
  <circle cx="150" cy="180" r="8" fill="#bae6fd"/>
